<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TruckMind - Simulateur</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='simulator.css') }}">
</head>
<body>

<div class="container">
    <a href="/" class="nav-back">← Retour au Chat</a>
    <h1><img src="{{ url_for('static', filename='icon.png') }}" alt="TruckMind Logo" style="width:36px; height:36px; object-fit:contain; vertical-align: bottom; margin-right: 10px;"> TruckMind Simulateur</h1>
    
    <div class="controls">
        <label for="city">Destination :</label>
        <select id="city">
            <option value="Tétouan">Tétouan</option>
            <option value="Casablanca">Casablanca</option>
            <option value="Rabat">Rabat</option>
            <option value="Fès">Fès</option>
            <option value="Marrakech">Marrakech</option>
            <option value="Agadir">Agadir</option>
            <option value="Meknès">Meknès</option>
            <option value="Oujda">Oujda</option>
            <option value="Kenitra">Kenitra</option>
        </select>
        <button onclick="startJourney()">DÉMARRER LE TRAJET</button>
        <button class="stop" onclick="stopJourney()">ARRÊTER</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="card-title">Statut</div>
            <div class="card-val" id="status" style="font-size: 18px; color: #e2e8f0;">En attente...</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div class="card">
            <div class="card-title">Vitesse (km/h)</div>
            <div class="card-val" id="speed">0.0</div>
        </div>
        <div class="card">
            <div class="card-title">Charge (Tonnes)</div>
            <div class="card-val" id="load">0.0</div>
        </div>
        <div class="card">
            <div class="card-title">Distance (km)</div>
            <div class="card-val" id="distance">0.0</div>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <a href="/api/v2/report" target="_blank" style="color: #38bdf8; text-decoration: underline;">📄 Générer le Rapport PDF du dernier trajet</a>
    </div>
</div>

<script src="{{ url_for('static', filename='simulator.js') }}"></script>

</body>
</html>
